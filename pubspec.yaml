name: wanis_app
description: "An interactive educational app for children to learn about emotions and develop social skills."
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  firebase_core: ^4.5.0
  firebase_auth: ^6.2.0
  cloud_firestore: ^6.1.3
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^7.0.1
  google_fonts: ^8.0.2
  camera: ^0.11.0+2
  tflite_flutter: ^0.12.1
  image: ^4.1.7
  video_player: ^2.8.3
  shared_preferences: ^2.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4


flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/logo_foreground.png"
  remove_alpha_ios: true


flutter:


  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/level2/
    - assets/images/level3/
    - assets/images/level4/
    - assets/videos/
    - assets/models/
